services:
  ncache:
    build: .
    container_name: ncache
    ports:
      - "127.0.0.1:${APPLICATION_PORT:-5001}:${PORT:-5001}"
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          memory: "200M"
    networks:
      - formstr

networks:
  formstr:
    external: true
